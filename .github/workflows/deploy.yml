name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: stride

permissions:
  id-token: write
  contents: read

jobs:
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: uat

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::138532987568:role/stride-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update UAT App Runner service
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.event.workflow_run.head_sha }}"
          echo "Deploying $IMAGE to UAT"
          aws apprunner update-service \
            --service-arn "${{ secrets.UAT_SERVICE_ARN }}" \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"${IMAGE}\",
                \"ImageRepositoryType\": \"ECR\"
              }
            }"

      - name: Wait for UAT to be running
        run: |
          echo "Waiting for UAT service to reach RUNNING state..."
          for i in $(seq 1 30); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "${{ secrets.UAT_SERVICE_ARN }}" \
              --query "Service.Status" --output text)
            echo "  status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "UAT is live."
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for UAT." && exit 1

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-uat
    environment: production    # requires manual approval in GitHub repo settings

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::138532987568:role/stride-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Prod App Runner service
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.event.workflow_run.head_sha }}"
          echo "Deploying $IMAGE to Prod"
          aws apprunner update-service \
            --service-arn "${{ secrets.PROD_SERVICE_ARN }}" \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"${IMAGE}\",
                \"ImageRepositoryType\": \"ECR\"
              }
            }"

      - name: Wait for Prod to be running
        run: |
          echo "Waiting for Prod service to reach RUNNING state..."
          for i in $(seq 1 30); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "${{ secrets.PROD_SERVICE_ARN }}" \
              --query "Service.Status" --output text)
            echo "  status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Prod is live."
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for Prod." && exit 1
