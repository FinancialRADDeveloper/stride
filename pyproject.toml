[project]
name = "stride"
version = "0.1.0"
description = "Personal day-lane task board with Google Calendar sync"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.17",
    "dash-mantine-components>=0.14",
    "pydantic>=2.0",
    "pendulum>=3.0",
    "apscheduler>=3.10",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "cryptography>=42.0",
    "typer>=0.12",
    "python-ulid>=2.0",
]

[project.scripts]
stride = "stride.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
