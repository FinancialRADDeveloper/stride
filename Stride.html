<style>
  :root {
    --bg: #f3ecdc;
    --bg-2: #ece3d0;
    --surface: #fbf7ee;
    --surface-2: #ffffff;
    --ink: #16181d;
    --ink-2: #3a3f4a;
    --muted: #707684;
    --line: rgba(20, 22, 28, 0.10);
    --line-soft: rgba(20, 22, 28, 0.06);
    --coral: #d94a5e;
    --coral-soft: #f7d9dd;
    --navy: #2a4a7f;
    --navy-soft: #d9e1ee;
    --olive: #4f7a3b;
    --olive-soft: #dde5cf;
    --amber: #c98521;
    --amber-soft: #f3e0bf;
    --violet: #6a4ea3;
    --violet-soft: #e3dbef;
    --radius: 10px;
    --radius-card: 12px;
    --shadow-card: 0 1px 0 rgba(20,22,28,0.04), 0 1px 2px rgba(20,22,28,0.04);
    --shadow-card-hover: 0 1px 0 rgba(20,22,28,0.04), 0 6px 18px rgba(20,22,28,0.10);
    --shadow-panel: 0 24px 48px rgba(20,22,28,0.18), 0 2px 8px rgba(20,22,28,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  input, textarea, select {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }
  input:focus, textarea:focus, select:focus, button:focus { outline: none; }
  ::selection { background: rgba(217, 74, 94, 0.20); }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; font-feature-settings: "tnum"; }
  .serif { font-family: "Newsreader", Georgia, serif; font-style: italic; }
  #root { height: 100vh; }
</style>
